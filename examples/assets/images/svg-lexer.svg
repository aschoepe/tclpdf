<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <rect x="0" y="0" width="200" height="280" fill="#ffffff"/>
  <text x="100" y="9" font-family="Helvetica" font-size="6" text-anchor="middle" fill="#000000">Path notation</text>
  <text x="100" y="17" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">Thick pale: spelled out. Thin blue: short form. Must coincide exactly.</text>

  <g font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">
    <g transform="translate(4,22)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 4 34 L 16 14 L 26 34 L 15 26 L 4 34 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M4 34l12-20 10 20-11-8-11 8z" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="60" y="16">minus sign as the</text>
      <text x="60" y="21">only separator</text>
      <text x="47" y="46">M4 34l12-20 10 20-11-8-11 8z</text>
    </g>

    <g transform="translate(102,22)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 20.5 6.5 L 50.75 27 L 20.5 27.5 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M20.5 6.5l30.25 20.5-30.25.5z" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="70" y="34">no leading zero</text>
      <text x="47" y="46">M20.5 6.5l30.25 20.5-30.25.5z</text>
    </g>

    <g transform="translate(4,74)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 10 8 L 65 28 L 20 33 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M 1e1 8 L 6.5e1 2.8e1 L 2e1 3.3e1 Z" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="47" y="46">exponent form: 1e1 = 10, 6.5e1 = 65</text>
    </g>

    <g transform="translate(102,74)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 10 8 L 60 10 L 30 32 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M 10 8 60 10 30 32 Z" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="47" y="46">M with three pairs - pairs 2 and 3 are L</text>
    </g>

    <g transform="translate(4,126)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 8 34 L 20 10 L 34 34 L 46 10 L 60 34" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M 8 34 L 20 10 34 34 46 10 60 34" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="47" y="46">one L, four segments</text>
    </g>

    <g transform="translate(102,126)">
      <rect x="0" y="0" width="94" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 10 32 L 30 8 L 50 32 L 70 8" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M10,32
               L30,8
               L50,32
               L70,8" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="47" y="46">commas and line breaks inside d</text>
    </g>

    <g transform="translate(4,178)">
      <rect x="0" y="0" width="192" height="44" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 10 34 L 30 8 L 50 34 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M 10 34 L 30 8 L 50 34 Z" fill="none" stroke="#1a3fa0" stroke-width="1" wobble="17" data-note="ignore me"/>
      <nosuchelement x="60" y="10" width="20" height="20">
        <path d="M 70 10 L 110 34" fill="none" stroke="#c02020" stroke-width="2"/>
      </nosuchelement>
      <path d="M 120 34 L 140 8 L 160 34 Z" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M 120 34 L 140 8 L 160 34 Z" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="96" y="50">Two triangles, no red line: unknown attributes and unknown elements are skipped,</text>
      <text x="96" y="55">the shape after them is still drawn</text>
    </g>

    <g transform="translate(4,236)">
      <rect x="0" y="0" width="192" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <path d="M 10 18 C 24 6 38 6 52 18 C 66 30 80 30 94 18" fill="none" stroke="#9fb8e8" stroke-width="4"/>
      <path d="M10 18c14-12 28-12 42 0c14 12 28 12 42 0" fill="none" stroke="#1a3fa0" stroke-width="1"/>
      <text x="145" y="16">relative c, no spaces</text>
      <text x="145" y="22">around the minus signs</text>
    </g>
  </g>
</svg>
