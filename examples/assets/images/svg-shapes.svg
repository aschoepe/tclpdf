<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <rect x="0" y="0" width="200" height="280" fill="#ffffff"/>
  <text x="100" y="9" font-family="Helvetica" font-size="6" text-anchor="middle" fill="#000000">Basic shapes - every shape twice</text>

  <g font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">
    <text x="100" y="17" font-size="4.2">Upper box: own element. Lower box: same shape as path. Must match.</text>

    <g transform="translate(4,20)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <rect x="4" y="4" width="34" height="20" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">rect</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 4 4 H 38 V 24 H 4 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path</text>
    </g>

    <g transform="translate(52,20)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <rect x="4" y="4" width="34" height="20" rx="8" ry="6" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">rect with rx 8, ry 6</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 12 4 H 30 A 8 6 0 0 1 38 10 V 18 A 8 6 0 0 1 30 24 H 12 A 8 6 0 0 1 4 18 V 10 A 8 6 0 0 1 12 4 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path</text>
    </g>

    <g transform="translate(100,20)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <circle cx="22" cy="14" r="11" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">circle</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 11 14 A 11 11 0 1 0 33 14 A 11 11 0 1 0 11 14 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path, two arcs</text>
    </g>

    <g transform="translate(148,20)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <ellipse cx="22" cy="14" rx="17" ry="9" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">ellipse</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 5 14 A 17 9 0 1 0 39 14 A 17 9 0 1 0 5 14 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path, two arcs</text>
    </g>

    <g transform="translate(4,100)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <line x1="4" y1="24" x2="40" y2="4" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">line</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 4 24 L 40 4" fill="none" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path</text>
    </g>

    <g transform="translate(52,100)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <polyline points="4,24 14,6 24,22 40,6" fill="none" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">polyline, open, no fill</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 4 24 L 14 6 L 24 22 L 40 6" fill="none" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path, no Z</text>
    </g>

    <g transform="translate(100,100)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <polygon points="22,3 40,13 34,25 10,25 4,13" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">polygon, closed</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <path d="M 22 3 L 40 13 L 34 25 L 10 25 L 4 13 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">as path, with Z</text>
    </g>

    <g transform="translate(148,100)">
      <rect x="0" y="0" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <polyline points="6,6 38,6 38,24 6,24" fill="none" stroke="#1a3fa0" stroke-width="1.2"/>
      <text x="22" y="34">polyline stays open on the left</text>
      <rect x="0" y="36" width="44" height="30" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(0,36)">
        <polygon points="6,6 38,6 38,24 6,24" fill="none" stroke="#1a3fa0" stroke-width="1.2"/>
      </g>
      <text x="22" y="70">polygon closes it - 4 sides</text>
    </g>

    <text x="100" y="188" font-size="4.2">Same star polygon, two fill rules - the middle must differ</text>

    <g transform="translate(4,192)">
      <rect x="0" y="0" width="94" height="58" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(25,8) scale(1.4)">
        <polygon points="22,3 29.05,24.71 10.59,11.29 33.41,11.29 14.95,24.71" fill-rule="nonzero" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="0.9"/>
      </g>
      <text x="47" y="55">nonzero - inner pentagon filled</text>
    </g>

    <g transform="translate(102,192)">
      <rect x="0" y="0" width="94" height="58" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
      <g transform="translate(25,8) scale(1.4)">
        <polygon points="22,3 29.05,24.71 10.59,11.29 33.41,11.29 14.95,24.71" fill-rule="evenodd" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="0.9"/>
      </g>
      <text x="47" y="55">evenodd - inner pentagon white</text>
    </g>
  </g>
</svg>
