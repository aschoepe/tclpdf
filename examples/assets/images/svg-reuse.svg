<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 280" width="200" height="280">
  <rect x="0" y="0" width="200" height="280" fill="#ffffff"/>
  <text x="100" y="9" font-family="Helvetica" font-size="6" text-anchor="middle" fill="#000000">use, symbol, defs</text>

  <defs>
    <path id="tile" d="M 0 0 L 16 0 L 16 6 L 24 6 L 12 20 L 0 6 Z" fill="#c8d4f0" stroke="#1a3fa0" stroke-width="1"/>
    <g id="pair">
      <circle cx="8" cy="8" r="7" fill="#d07a00" stroke="#000000" stroke-width="0.8"/>
      <rect x="18" y="1" width="14" height="14" fill="#1a7f37" stroke="#000000" stroke-width="0.8"/>
    </g>
    <symbol id="sym" viewBox="0 0 24 20">
      <path d="M 0 0 L 16 0 L 16 6 L 24 6 L 12 20 L 0 6 Z" fill="#f0d0d0" stroke="#c02020" stroke-width="1"/>
    </symbol>
  </defs>

  <text x="100" y="18" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">One shape in defs, placed three times with x and y</text>

  <rect x="4" y="22" width="192" height="40" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <use xlink:href="#tile" x="14" y="26"/>
  <use xlink:href="#tile" x="74" y="30"/>
  <use xlink:href="#tile" x="134" y="34"/>
  <g font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">
    <text x="26" y="60">x 14 y 26</text>
    <text x="86" y="60">x 74 y 30, four lower</text>
    <text x="146" y="60">x 134 y 34, eight lower</text>
  </g>

  <text x="100" y="72" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">Forward reference - the target is defined at the end of the file</text>

  <rect x="4" y="76" width="192" height="34" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <use xlink:href="#late" x="20" y="82"/>
  <text x="120" y="96" font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">A green triangle must stand on the left of this box</text>

  <text x="100" y="120" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">symbol - invisible on its own, visible through use</text>

  <rect x="4" y="124" width="94" height="44" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <text x="51" y="174" font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">must stay empty</text>

  <rect x="102" y="124" width="94" height="44" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <use xlink:href="#sym" x="118" y="129" width="40" height="33"/>
  <text x="149" y="174" font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">red bordered shape, scaled to 40 by 33</text>

  <text x="100" y="186" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">use pointing at a whole group</text>

  <rect x="4" y="190" width="192" height="34" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <use xlink:href="#pair" x="16" y="196"/>
  <use xlink:href="#pair" x="76" y="204"/>
  <text x="150" y="212" font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">circle and square, twice, second one lower</text>

  <text x="100" y="234" font-family="Helvetica" font-size="4.2" text-anchor="middle" fill="#000000">Reference into the void - must draw nothing and break nothing</text>

  <rect x="4" y="238" width="192" height="34" fill="none" stroke="#b0b0b0" stroke-width="0.3"/>
  <use xlink:href="#does-not-exist" x="20" y="244"/>
  <use xlink:href="#tile" x="20" y="244"/>
  <text x="130" y="258" font-family="Helvetica" font-size="3.2" fill="#000000" text-anchor="middle">The blue shape after the dead reference must still be here</text>

  <defs>
    <path id="late" d="M 12 0 L 24 22 L 0 22 Z" fill="#1a7f37" stroke="#000000" stroke-width="0.8"/>
  </defs>
</svg>
